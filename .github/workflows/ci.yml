name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actions-lock-verify:
    permissions:
      contents: read # checkout repository to verify actions.lock
    uses: berquerant/reusable-workflows/.github/workflows/actions-lock-verify.yml@v0.9.1

  ci:
    permissions:
      contents: read # checkout repository for Emacs CI
    uses: berquerant/reusable-workflows/.github/workflows/emacs-ci.yml@v0.9.1
    with:
      emacs-versions: |
        30.1
        29.4
        28.2
        27.2
        26.3
        25.3
        24.5
      byte-compile-error-on-warn: false
      setup-command: mkdir -p ~/.emacs.d && touch ~/.emacs.d/history
